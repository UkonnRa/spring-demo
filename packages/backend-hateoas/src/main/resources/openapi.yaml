openapi: 3.1.0
info:
  title: Spring Electron Test
  description: Spring Electron Test OpenAPI Doc
  version: 0.1.0
servers:
  - name: Localhost
    url: "http://localhost:8080"
tags:
  - name: Journals
    description: Actions for Journals
  - name: Accounts
    description: Actions for Accounts
  - name: Entries
    description: Actions for Entries
  - name: Hierarchy Reports
    description: Actions for Hierarchy Reports
paths:
  /journals:
    get:
      tags:
        - Journals
      summary: Get multiple Journals
      description: Get multiple Journals based on the given filters.
      operationId: findAllJournals
      parameters:
        - name: filter[id]
          in: query
          description: Find Journals by IDs
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              format: uuid
        - name: filter[name]
          in: query
          description: Find Journals by names, exactly matching
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - name: filter[unit]
          in: query
          description: Find Journals by units, exactly matching
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - name: filter[tag]
          in: query
          description: Find Journals by tag, exactly matching
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - name: filter[fullText]
          in: query
          description: Find Journals by full-text searching on `name`,  `description` and `tags`
          schema:
            type: string
      responses:
        200:
          description: Receive all Journals by the given filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalsResponse"
    post:
      tags:
        - Journals
      summary: Create a Journal
      description: Create Journal by the given command.
      operationId: createJournal
      requestBody:
        required: true
        description: Create Journal Command.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalCommandCreate"
      responses:
        200:
          description: Created successfully and return the generated Journal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalResponse"
    patch:
      tags:
        - Journals
      summary: Batch Update multiple Journals
      description: Batch Update Journals by the given command.
      operationId: batchJournals
      requestBody:
        required: true
        description: Batch Journal Command.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalCommandBatch"
      responses:
        200:
          description: Batch updated successfully and return the generated Journals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalsResponse"
  /journals/{id}:
    get:
      tags:
        - Journals
      summary: Get one Journal
      description: Get one Journals by ID.
      operationId: findJournalById
      parameters:
        - name: id
          in: path
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Receive one Journal by the given ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalResponse"
        404:
          description: Not Found
    patch:
      tags:
        - Journals
      summary: Update a Journal
      description: Update a Journal by ID based on the given command.
      operationId: updateJournal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: Update Journal Command.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalCommandUpdate"
      responses:
        200:
          description: Updated successfully and return the updated Journal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalResponse"
        404:
          description: Not Found
    delete:
      tags:
        - Journals
      summary: Delete a Journal
      description: Delete a Journal by ID.
      operationId: deleteJournal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Deleted successfully, no content.
  /accounts:
    get:
      tags:
        - Accounts
      summary: Get multiple Accounts
      description: Get multiple Accounts based on the given filters.
      operationId: findAllAccounts
      parameters:
        - name: filter[id]
          in: query
          description: Find Accounts by IDs
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              format: uuid
        - name: filter[name]
          in: query
          description: Find Accounts by names, exactly matching
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - name: filter[unit]
          in: query
          description: Find Accounts by units, exactly matching
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - name: filter[type]
          in: query
          description: Find Accounts by types
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: "#/components/schemas/AccountType"
        - name: filter[tag]
          in: query
          description: Find Accounts by tag, exactly matching
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - name: filter[fullText]
          in: query
          description: Find Accounts by full-text searching on `name`,  `description` and `tags`
          schema:
            type: string
      responses:
        200:
          description: Receive all Accounts by the given filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsResponse"
    post:
      tags:
        - Accounts
      summary: Create a Account
      description: Create Account by the given command.
      operationId: createAccount
      requestBody:
        required: true
        description: Create Account Command.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCommandCreate"
      responses:
        200:
          description: Created successfully and return the generated Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
    patch:
      tags:
        - Accounts
      summary: Batch Update multiple Accounts
      description: Batch Update Accounts by the given command.
      operationId: batchAccounts
      requestBody:
        required: true
        description: Batch Accounts Command.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCommandBatch"
      responses:
        200:
          description: Batch updated successfully and return the generated Accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsResponse"
  /accounts/{id}:
    get:
      tags:
        - Accounts
      summary: Get one Account
      description: Get one Account by ID.
      operationId: findAccountById
      parameters:
        - name: id
          in: path
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Receive one Account by the given ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        404:
          description: Not Found
    patch:
      tags:
        - Accounts
      summary: Update a Account
      description: Update a Account by ID based on the given command.
      operationId: updateAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: Update Account Command.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCommandUpdate"
      responses:
        200:
          description: Updated successfully and return the updated Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        404:
          description: Not Found
    delete:
      tags:
        - Accounts
      summary: Delete an Account
      description: Delete an Account by ID.
      operationId: deleteAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Deleted successfully, no content.
  /entries:
    get:
      tags:
        - Entries
      summary: Get multiple Entries
      description: Get multiple Entries based on the given filters.
      operationId: findAllEntries
      parameters:
        - name: filter[id]
          in: query
          description: Find Entries by IDs
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              format: uuid
        - name: filter[journal]
          in: query
          description: Find Entries by Journal IDs
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              format: uuid
        - name: filter[account]
          in: query
          description: Find Entries by Account IDs
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              format: uuid
        - name: filter[name]
          in: query
          description: Find Entries by names, exactly matching
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - name: filter[type]
          in: query
          required: false
          description: Find Entries by the type
          schema:
            $ref: "#/components/schemas/EntryType"
        - name: filter[start]
          in: query
          required: false
          description: Find Entries after the date
          schema:
            type: string
            format: date
        - name: filter[end]
          in: query
          required: false
          description: Find Entries before the date
          schema:
            type: string
            format: date
        - name: filter[tag]
          in: query
          description: Find Entries by tag, exactly matching
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - name: filter[fullText]
          in: query
          description: Find Entries by full-text searching on `name` and `tags`
          schema:
            type: string
      responses:
        200:
          description: Receive all Entries by the given filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntriesResponse"
    post:
      tags:
        - Entries
      summary: Create an Entry
      description: Create an Entry by the given command.
      operationId: createEntry
      requestBody:
        required: true
        description: Create Entry Command.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryCommandCreate"
      responses:
        200:
          description: Created successfully and return the generated Entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryResponse"
    patch:
      tags:
        - Entries
      summary: Batch Update multiple Entries
      description: Batch Update Entries by the given command.
      operationId: batchEntries
      requestBody:
        required: true
        description: Batch Entries Command.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryCommandBatch"
      responses:
        200:
          description: Batch updated successfully and return the generated Entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntriesResponse"
  /entries/{id}:
    get:
      tags:
        - Entries
      summary: Get one Entry
      description: Get one Entry by ID.
      operationId: findEntryById
      parameters:
        - name: id
          in: path
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Receive one Entry by the given ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryResponse"
        404:
          description: Not Found
    patch:
      tags:
        - Entries
      summary: Update a Entry
      description: Update a Entry by ID based on the given command.
      operationId: updateEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: Update Entry Command.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryCommandUpdate"
      responses:
        200:
          description: Updated successfully and return the updated Entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryResponse"
        404:
          description: Not Found
    delete:
      tags:
        - Entries
      summary: Delete an Entry
      description: Delete an Entry by ID.
      operationId: deleteEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Deleted successfully, no content.
  /hierarchy-reports:
    get:
      tags:
        - Hierarchy Reports
      summary: Get multiple Hierarchy Reports
      description: Get multiple Hierarchy Reports based on the given filters.
      operationId: findAllHierarchyReports
      parameters:
        - name: filter[id]
          in: query
          description: Find Hierarchy Reports by IDs
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - name: filter[journal]
          in: query
          description: Find Hierarchy Reports by Journal IDs
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              format: uuid
        - name: filter[start]
          in: query
          description: Find Hierarchy Reports by entries after the date
          schema:
            type: string
            format: date
        - name: filter[end]
          in: query
          description: Find Hierarchy Reports by entries before the date
          schema:
            type: string
            format: date
      responses:
        200:
          description: Receive all Hierarchy Reports by the given filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HierarchyReportsResponse"
  /hierarchy-reports/{id}:
    get:
      tags:
        - Hierarchy Reports
      summary: Get one Hierarchy Report
      description: Get one Hierarchy Report by ID.
      operationId: findHierarchyReportById
      parameters:
        - name: id
          in: path
          schema:
            type: string
      responses:
        200:
          description: Receive one Hierarchy Report by the given ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HierarchyReportResponse"
        404:
          description: Not Found

components:
  schemas:
    # === Common Schemas ===
    Link:
      type: object
      required:
        - href
      properties:
        href:
          type: string
          format: uri

    AbstractModel:
      type: object
      required:
        - id
        - createdDate
      properties:
        id:
          type: string
          format: uuid
        createdDate:
          type: string
          format: date-time

    # === Journals ===

    ## --- Journal Common ---

    JournalLinks:
      type: object
      properties:
        self:
          $ref: "#/components/schemas/Link"

    JournalsResponse:
      allOf:
        - $ref: "#/components/schemas/Journals"
        - type: object
          properties:
            _links:
              $ref: "#/components/schemas/JournalLinks"
    JournalResponse:
      allOf:
        - $ref: "#/components/schemas/Journal"
        - type: object
          properties:
            _links:
              $ref: "#/components/schemas/JournalLinks"

    ## --- Journal Entity ---

    JournalAttributes:
      type: object
      required:
        - name
        - description
        - unit
        - tags
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 127
          example: New Journal
        description:
          type: string
          maxLength: 1023
          default: ""
        unit:
          type: string
          minLength: 2
          maxLength: 127
          example: USD
        tags:
          type: array
          maxItems: 15
          uniqueItems: true
          default: []
          items:
            type: string
            minLength: 2
            maxLength: 127

    Journal:
      allOf:
        - $ref: "#/components/schemas/AbstractModel"
        - $ref: "#/components/schemas/JournalAttributes"

    Journals:
      type: object
      required:
        - values
      properties:
        values:
          type: array
          items:
            $ref: "#/components/schemas/Journal"

    ## --- Journal Commands ---
    JournalCommandCreate:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
        - $ref: "#/components/schemas/JournalAttributes"

    JournalCommandUpdate:
      $ref: "#/components/schemas/JournalAttributes"
      required: []

    JournalCommandBatch:
      type: object
      properties:
        create:
          type: array
          default: []
          uniqueItems: true
          items:
            $ref: "#/components/schemas/JournalCommandCreate"
        update:
          type: array
          default: []
          uniqueItems: true
          items:
            allOf:
              - type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid
              - $ref: "#/components/schemas/JournalCommandUpdate"
        delete:
          type: array
          default: []
          uniqueItems: true
          items:
            type: string
            format: uuid

    # === Accounts ===

    ## --- Account Common ---
    AccountType:
      type: string
      enum: [INCOME, EXPENSE, ASSET, LIABILITY, EQUITY]

    AccountLinks:
      type: object
      properties:
        self:
          $ref: "#/components/schemas/Link"
        journal:
          $ref: "#/components/schemas/Link"

    AccountEmbedded:
      type: object
      properties:
        journals:
          type: array
          items:
            $ref: "#/components/schemas/Journal"

    AccountResponse:
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          properties:
            _links:
              $ref: "#/components/schemas/AccountLinks"
            _embedded:
              $ref: "#/components/schemas/AccountEmbedded"

    AccountsResponse:
      allOf:
        - $ref: "#/components/schemas/Accounts"
        - type: object
          properties:
            _links:
              $ref: "#/components/schemas/AccountLinks"
            _embedded:
              $ref: "#/components/schemas/AccountEmbedded"

    ## --- Account Entity ---

    AccountRelationships:
      type: object
      required:
        - journalId
      properties:
        journalId:
          type: string
          format: uuid

    AccountAttributes:
      type: object
      required:
        - name
        - description
        - unit
        - type
        - tags
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 127
          example: New Account
        description:
          type: string
          maxLength: 1023
          default: ""
        unit:
          type: string
          minLength: 2
          maxLength: 127
          example: USD
        type:
          $ref: "#/components/schemas/AccountType"
        tags:
          type: array
          maxItems: 15
          uniqueItems: true
          default: []
          items:
            type: string
            minLength: 2
            maxLength: 127

    Account:
      allOf:
        - $ref: "#/components/schemas/AbstractModel"
        - $ref: "#/components/schemas/AccountAttributes"
        - $ref: "#/components/schemas/AccountRelationships"

    Accounts:
      type: object
      required:
        - values
      properties:
        values:
          type: array
          items:
            $ref: "#/components/schemas/Account"

    ## --- Account Commands ---
    AccountCommandCreate:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
        - $ref: "#/components/schemas/AccountAttributes"
        - $ref: "#/components/schemas/AccountRelationships"

    AccountCommandUpdate:
      $ref: "#/components/schemas/AccountAttributes"
      required: []

    AccountCommandBatch:
      type: object
      properties:
        create:
          type: array
          default: []
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AccountCommandCreate"
        update:
          type: array
          default: []
          uniqueItems: true
          items:
            allOf:
              - type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid
              - $ref: "#/components/schemas/AccountCommandUpdate"
        delete:
          type: array
          default: []
          uniqueItems: true
          items:
            type: string
            format: uuid

    # === Entry ===

    ## --- Entry Common ---

    EntryType:
      type: string
      enum: [RECORD, CHECK]

    EntryItem:
      type: object
      required:
        - accountId
        - amount
        - price
      properties:
        accountId:
          type: string
          format: uuid
        amount:
          type: number
          format: float
          minimum: 0
        price:
          type: number
          format: float
          minimum: 0

    EntryLinks:
      type: object
      properties:
        self:
          $ref: "#/components/schemas/Link"
        journal:
          $ref: "#/components/schemas/Link"
        account:
          $ref: "#/components/schemas/Link"

    EntryEmbedded:
      type: object
      properties:
        journals:
          type: array
          items:
            $ref: "#/components/schemas/Journal"
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"

    EntryResponse:
      allOf:
        - $ref: "#/components/schemas/Entry"
        - type: object
          properties:
            _links:
              $ref: "#/components/schemas/EntryLinks"
            _embedded:
              $ref: "#/components/schemas/EntryEmbedded"

    EntriesResponse:
      allOf:
        - $ref: "#/components/schemas/Entries"
        - type: object
          properties:
            _links:
              $ref: "#/components/schemas/EntryLinks"
            _embedded:
              $ref: "#/components/schemas/EntryEmbedded"

    ## --- Entry Entity ---

    EntryRelationships:
      type: object
      required:
        - journalId
      properties:
        journalId:
          type: string
          format: uuid

    EntryAttributes:
      type: object
      required:
        - name
        - description
        - type
        - date
        - tags
        - items
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 127
          example: New Entry
        description:
          type: string
          maxLength: 1023
          default: ""
        type:
          $ref: "#/components/schemas/EntryType"
        date:
          type: string
          format: date
        tags:
          type: array
          maxItems: 15
          uniqueItems: true
          default: []
          items:
            type: string
            minLength: 2
            maxLength: 127
        items:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: "#/components/schemas/EntryItem"

    Entry:
      allOf:
        - $ref: "#/components/schemas/AbstractModel"
        - $ref: "#/components/schemas/EntryAttributes"
        - $ref: "#/components/schemas/EntryRelationships"

    Entries:
      type: object
      required:
        - values
      properties:
        values:
          type: array
          items:
            $ref: "#/components/schemas/Entry"

    ## --- Entry Commands ---
    EntryCommandCreate:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
        - $ref: "#/components/schemas/EntryAttributes"
        - $ref: "#/components/schemas/EntryRelationships"

    EntryCommandUpdate:
      $ref: "#/components/schemas/EntryAttributes"
      required: []

    EntryCommandBatch:
      type: object
      properties:
        create:
          type: array
          default: []
          uniqueItems: true
          items:
            $ref: "#/components/schemas/EntryCommandCreate"
        update:
          type: array
          default: []
          uniqueItems: true
          items:
            allOf:
              - type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid
              - $ref: "#/components/schemas/EntryCommandUpdate"
        delete:
          type: array
          default: []
          uniqueItems: true
          items:
            type: string
            format: uuid

    # === Hierarchy Report ===

    ## --- Hierarchy Report Common ---

    HierarchyReportLinks:
      type: object
      properties:
        self:
          $ref: "#/components/schemas/Link"
        journal:
          $ref: "#/components/schemas/Link"
        accounts:
          $ref: "#/components/schemas/Link"

    HierarchyReportEmbedded:
      type: object
      properties:
        journals:
          type: array
          items:
            $ref: "#/components/schemas/Journal"
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"

    HierarchyReportResponse:
      allOf:
        - $ref: "#/components/schemas/HierarchyReport"
        - type: object
          properties:
            _links:
              $ref: "#/components/schemas/HierarchyReportLinks"
            _embedded:
              $ref: "#/components/schemas/HierarchyReportEmbedded"

    HierarchyReportsResponse:
      allOf:
        - $ref: "#/components/schemas/HierarchyReports"
        - type: object
          properties:
            _links:
              $ref: "#/components/schemas/HierarchyReportLinks"
            _embedded:
              $ref: "#/components/schemas/HierarchyReportEmbedded"

    ## --- Hierarchy Report Entity ---

    HierarchyReport:
      type: object
      required:
        - id
        - journalId
        - prefix
        - unit
        - values
      properties:
        id:
          type: string
          format: uuid
        journalId:
          type: string
          format: uuid
        prefix:
          type: string
          minLength: 2
          example: Account
        unit:
          type: string
          minLength: 2
          maxLength: 127
          example: USD
        values:
          type: object
          additionalProperties:
            type: number
