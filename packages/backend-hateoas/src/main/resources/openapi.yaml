openapi: 3.1.0
info:
  title: Spring Electron Test
  description: Spring Electron Test OpenAPI Doc
  version: 0.1.0
servers:
  - name: Localhost
    url: 'http://localhost:8080'
tags:
  - name: Journals
    description: Actions for Journals
  - name: Accounts
    description: Actions for Accounts
paths:
  /journals:
    get:
      tags:
        - Journals
      summary: Get multiple Journals
      description: Get multiple Journals based on the given filters.
      operationId: findAllJournals
      parameters:
        - name: filter[id]
          in: query
          description: Find Journals by IDs
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              format: uuid
        - name: filter[name]
          in: query
          description: Find Journals by names, exactly matching
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - name: filter[unit]
          in: query
          description: Find Journals by units, exactly matching
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - name: filter[tag]
          in: query
          description: Find Journals by tag, exactly matching
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - name: filter[fullText]
          in: query
          description: Find Journals by full-text searching on `name`,  `description` and `tags`
          schema:
            type: string
      responses:
        200:
          description: Receive all Journals by the given filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalsResponse"
    post:
      tags:
        - Journals
      summary: Create a Journal
      description: Create Journal by the given command.
      operationId: createJournal
      requestBody:
        required: true
        description: Create Journal Command.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalCommandCreate"
      responses:
        200:
          description: Created successfully and return the generated Journal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalResponse"
    patch:
      tags:
        - Journals
      summary: Batch Update multiple Journals
      description: Batch Update Journals by the given command.
      operationId: batchJournals
      requestBody:
        required: true
        description: Batch Journal Command.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalCommandBatch"
      responses:
        200:
          description: Batch updated successfully and return the generated Journals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalsResponse"
  /journals/{id}:
    get:
      tags:
        - Journals
      summary: Get one Journal
      description: Get one Journals by ID.
      operationId: findJournalById
      parameters:
        - name: id
          in: path
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Receive one Journal by the given ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalResponse"
        404:
          description: Not Found
    patch:
      tags:
        - Journals
      summary: Update a Journal
      description: Update a Journal by ID based on the given command.
      operationId: updateJournal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: Update Journal Command.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalCommandUpdate"
      responses:
        200:
          description: Updated successfully and return the updated Journal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalResponse"
        404:
          description: Not Found
    delete:
      tags:
        - Journals
      summary: Delete a Journal
      description: Delete a Journal by ID.
      operationId: deleteJournal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Deleted successfully, no content.
  /accounts:
    get:
      tags:
        - Accounts
      summary: Get multiple Accounts
      description: Get multiple Accounts based on the given filters.
      operationId: findAllAccounts
      parameters:
        - name: filter[id]
          in: query
          description: Find Accounts by IDs
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              format: uuid
        - name: filter[name]
          in: query
          description: Find Accounts by names, exactly matching
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - name: filter[unit]
          in: query
          description: Find Accounts by units, exactly matching
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - name: filter[type]
          in: query
          description: Find Accounts by types
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: "#/components/schemas/AccountType"
        - name: filter[tag]
          in: query
          description: Find Accounts by tag, exactly matching
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - name: filter[fullText]
          in: query
          description: Find Accounts by full-text searching on `name`,  `description` and `tags`
          schema:
            type: string
      responses:
        200:
          description: Receive all Accounts by the given filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsResponse"
    post:
      tags:
        - Accounts
      summary: Create a Account
      description: Create Account by the given command.
      operationId: createAccount
      requestBody:
        required: true
        description: Create Account Command.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCommandCreate"
      responses:
        200:
          description: Created successfully and return the generated Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"

components:
  schemas:
    # === Common Schemas ===
    Link:
      type: object
      required:
        - href
      properties:
        href:
          type: string
          format: uri

    AbstractModel:
      type: object
      required:
        - id
        - createdDate
      properties:
        id:
          type: string
          format: uuid
        createdDate:
          type: string
          format: date-time

    # === Journals ===

    ## --- Journal Common ---

    JournalLinks:
      type: object
      properties:
        self:
          $ref: "#/components/schemas/Link"

    JournalsResponse:
      allOf:
        - $ref: "#/components/schemas/Journals"
        - type: object
          properties:
            _links:
              $ref: "#/components/schemas/JournalLinks"
    JournalResponse:
      allOf:
        - $ref: "#/components/schemas/Journal"
        - type: object
          properties:
            _links:
              $ref: "#/components/schemas/JournalLinks"

    ## --- Journal Entity ---

    JournalAttributes:
      type: object
      required:
        - name
        - description
        - unit
        - tags
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 127
          example: New Journal
        description:
          type: string
          maxLength: 1023
          default: ""
        unit:
          type: string
          minLength: 2
          maxLength: 127
          example: USD
        tags:
          type: array
          maxItems: 15
          uniqueItems: true
          default: [ ]
          items:
            type: string
            minLength: 2
            maxLength: 127

    Journal:
      allOf:
        - $ref: "#/components/schemas/AbstractModel"
        - $ref: "#/components/schemas/JournalAttributes"

    Journals:
      type: object
      required:
        - values
      properties:
        values:
          type: array
          items:
            $ref: "#/components/schemas/Journal"

    ## --- Journal Commands ---
    JournalCommandCreate:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
        - $ref: "#/components/schemas/JournalAttributes"

    JournalCommandUpdate:
      $ref: "#/components/schemas/JournalAttributes"
      required: [ ]

    JournalCommandBatch:
      type: object
      properties:
        create:
          type: array
          default: []
          uniqueItems: true
          items:
            $ref: "#/components/schemas/JournalCommandCreate"
        update:
          type: array
          default: []
          uniqueItems: true
          items:
            allOf:
              - type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid
              - $ref: "#/components/schemas/JournalCommandUpdate"
        delete:
          type: array
          default: []
          uniqueItems: true
          items:
            type: string
            format: uuid

    # === Accounts ===

    ## --- Account Common ---
    AccountType:
      type: string
      enum: [ INCOME, EXPENSE, ASSET, LIABILITY, EQUITY, ]
    AccountLinks:
      type: object
      properties:
        self:
          $ref: "#/components/schemas/Link"
        journal:
          $ref: "#/components/schemas/Link"

    AccountEmbedded:
      type: object
      properties:
        journals:
          type: array
          items:
            $ref: "#/components/schemas/Journal"

    AccountResponse:
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          properties:
            _links:
              $ref: "#/components/schemas/AccountLinks"
            _embedded:
              $ref: "#/components/schemas/AccountEmbedded"

    AccountsResponse:
      allOf:
        - $ref: "#/components/schemas/Accounts"
        - type: object
          properties:
            _links:
              $ref: "#/components/schemas/AccountLinks"
            _embedded:
              $ref: "#/components/schemas/AccountEmbedded"

    ## --- Account Entity ---

    AccountAttributes:
      type: object
      required:
        - name
        - description
        - unit
        - type
        - tags
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 127
          example: New Account
        description:
          type: string
          maxLength: 1023
          default: ""
        unit:
          type: string
          minLength: 2
          maxLength: 127
          example: USD
        type:
          $ref: "#/components/schemas/AccountType"
        tags:
          type: array
          maxItems: 15
          uniqueItems: true
          default: [ ]
          items:
            type: string
            minLength: 2
            maxLength: 127

    Account:
      allOf:
        - $ref: "#/components/schemas/AbstractModel"
        - $ref: "#/components/schemas/AccountAttributes"



    Accounts:
      type: object
      required:
        - values
      properties:
        values:
          type: array
          items:
            $ref: "#/components/schemas/Account"

    ## --- Account Commands ---
    AccountCommandCreate:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
        - $ref: "#/components/schemas/AccountAttributes"

    AccountCommandUpdate:
      $ref: "#/components/schemas/AccountAttributes"
      required: [ ]

    AccountCommandBatch:
      type: object
      properties:
        create:
          type: array
          default: []
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AccountCommandCreate"
        update:
          type: array
          default: []
          uniqueItems: true
          items:
            allOf:
              - type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid
              - $ref: "#/components/schemas/AccountCommandUpdate"
        delete:
          type: array
          default: []
          uniqueItems: true
          items:
            type: string
            format: uuid
